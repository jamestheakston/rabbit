<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Rabbit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .StripeElement {
            box-sizing: border-box;
            height: 40px;
            padding: 10px 12px;
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background-color: white;
        }
        .StripeElement--focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
        }
        .StripeElement--invalid {
            border-color: #ef4444;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="min-h-screen flex items-center justify-center p-4 sm:p-6">
        <!-- Split Layout Container -->
        <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-8 bg-white rounded-xl border border-slate-200 p-8 shadow-sm">
            
            <!-- Left Column: Context / Summary -->
            <div class="flex flex-col justify-between space-y-6">
                <div class="space-y-4">
                    <div class="flex items-center gap-3 mb-4">
                        <img src="logo.jpg" alt="Rabbit Logo" class="h-10 w-10 rounded-lg object-cover">
                        <h1 class="text-sm font-medium text-slate-700">Rabbit</h1>
                    </div>
                    <h2 id="payment-title" class="text-xl font-semibold text-slate-900">Payment</h2>
                    <p id="payment-description" class="text-sm text-slate-500 leading-relaxed"></p>
                </div>
                
                <!-- Amount Container -->
                <div class="flex items-center justify-between p-4 bg-slate-50 rounded-lg border border-slate-200">
                    <span id="payment-amount" class="text-3xl font-bold text-slate-900">£0.00</span>
                </div>
            </div>

            <!-- Right Column: Interactive Form -->
            <div id="payment-form" class="hidden space-y-6">
                <!-- Express Payment Grid -->
                <div id="payment-request-button-container" class="mb-6"></div>
                <div id="express-payment-buttons" class="hidden grid grid-cols-2 gap-2">
                    <div id="apple-pay-button" class="h-10 bg-black text-white font-medium rounded-md flex items-center justify-center text-sm cursor-pointer opacity-50">
                        <i class="fab fa-apple mr-2"></i>Apple Pay
                    </div>
                    <div id="google-pay-button" class="h-10 bg-white border border-slate-300 text-slate-900 font-medium rounded-md flex items-center justify-center text-sm cursor-pointer opacity-50">
                        <i class="fab fa-google mr-2"></i>Google Pay
                    </div>
                </div>
                <p id="payment-methods-message" class="text-sm text-gray-500 text-center hidden">Apple Pay and Google Pay are not available on this device. Please use card payment.</p>

                <!-- Form Inputs -->
                <div class="space-y-3">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500">Contact details</label>
                    <input type="email" id="email-input" placeholder="email@example.com" class="w-full h-10 px-3 rounded-md border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm" />
                </div>

                <!-- Card Input -->
                <div class="space-y-3">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500">Card details</label>
                    <div id="card-element"></div>
                    <div id="card-errors" class="text-red-500 text-sm"></div>
                </div>

                <!-- Submit CTA -->
                <button onclick="processPayment()" id="pay-btn" class="w-full h-11 bg-sky-600 hover:bg-sky-700 text-white font-medium rounded-md shadow-sm transition-colors">
                    Pay
                </button>
            </div>

            <!-- Loading State -->
            <div id="loading" class="col-span-1 md:col-span-2 p-8 text-center">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-slate-300 mx-auto mb-4"></div>
                <p class="text-slate-500 text-sm">Loading...</p>
            </div>

            <!-- Success State -->
            <div id="success" class="hidden col-span-1 md:col-span-2 p-8 text-center">
                <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <h2 class="text-lg font-semibold text-slate-900 mb-2">Payment successful</h2>
                <p class="text-sm text-slate-500">Thank you for your payment.</p>
            </div>

            <!-- Error State -->
            <div id="error" class="hidden col-span-1 md:col-span-2 p-8 text-center">
                <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </div>
                <h2 class="text-lg font-semibold text-slate-900 mb-2">Payment failed</h2>
                <p id="error-message" class="text-sm text-slate-500 mb-4">Something went wrong.</p>
                <button onclick="location.reload()" class="bg-sky-600 hover:bg-sky-700 text-white px-6 py-2 rounded-md font-medium transition-colors">
                    Try again
                </button>
            </div>
        </div>
    </div>

    <script>
        const STRIPE_PUBLISHABLE_KEY = 'pk_live_51U7YZRIgHrqGQ08gbdu7U7Q4sFTSliP3HjOvRbE8kWAuQ5rXfe4FUnqdB6y6E67KybV4eA8CdrA0tKBOTqPmvW1l00FUNaZ5GC';
        let stripe;
        let cardElement;
        let paymentRequestButton;
        let paymentData = null;

        // Get payment ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const paymentId = urlParams.get('id');

        if (!paymentId) {
            showError('Invalid payment link');
        } else {
            loadPaymentDetails(paymentId);
        }

        function loadPaymentDetails(id) {
            console.log('Loading payment details for ID:', id);
            
            // Load from Supabase using only the ID
            const SUPABASE_URL = 'https://kiirewgajdcagrkjznzd.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_N26VX9GlFsTK_ECpS-FTWw_0K1VWxPi';
            
            fetch(`${SUPABASE_URL}/rest/v1/payment_links?id=eq.${id}`, {
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data && data.length > 0) {
                    paymentData = data[0];
                    console.log('Payment data loaded successfully');
                    showPaymentForm();
                } else {
                    console.error('Payment data not found');
                    showError('Payment not found or expired');
                }
            })
            .catch(error => {
                console.error('Error loading from Supabase:', error);
                showError('Payment not found or expired');
            });
        }

        function showPaymentForm() {
            // Show payment form
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('payment-form').classList.remove('hidden');

            // Update UI
            document.getElementById('payment-title').textContent = paymentData.title;
            document.getElementById('payment-description').textContent = paymentData.description || '';
            const currencySymbol = paymentData.currency === 'eur' ? '€' : paymentData.currency === 'usd' ? '$' : '£';
            document.getElementById('payment-amount').textContent = currencySymbol + paymentData.amount.toFixed(2);

            console.log('UI updated, initializing Stripe...');
            // Initialize Stripe
            initializeStripe();
        }

        function initializeStripe() {
            try {
                stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
                const elements = stripe.elements({
                    appearance: {
                        theme: 'stripe',
                        variables: {
                            colorPrimary: '#0284c7',
                            colorBackground: '#ffffff',
                            colorText: '#334155',
                            colorDanger: '#ef4444',
                            fontFamily: 'Inter, sans-serif',
                            spacingUnit: '4px',
                            borderRadius: '6px',
                        }
                    }
                });

                // Card Element
                cardElement = elements.create('card', {
                    style: {
                        base: {
                            fontSize: '16px',
                            color: '#334155',
                            fontFamily: 'Inter, sans-serif',
                            '::placeholder': {
                                color: '#94a3b8'
                            }
                        }
                    }
                });

                const cardElementContainer = document.getElementById('card-element');
                if (!cardElementContainer) {
                    console.error('Card element container not found');
                    showError('Payment form error');
                    return;
                }

                cardElement.mount('#card-element');
                console.log('Card element mounted successfully');
                
                cardElement.on('ready', function() {
                    console.log('Card element is ready for input');
                });
                
                cardElement.on('change', function(event) {
                    const displayError = document.getElementById('card-errors');
                    if (event.error) {
                        displayError.textContent = event.error.message;
                    } else {
                        displayError.textContent = '';
                    }
                });

                // Payment Request Button (Apple Pay / Google Pay)
                const paymentRequest = stripe.paymentRequest({
                    country: 'GB',
                    currency: paymentData.currency.toLowerCase(),
                    total: {
                        label: paymentData.title,
                        amount: Math.round(paymentData.amount * 100),
                    },
                    requestPayerName: true,
                    requestPayerEmail: true,
                });

                paymentRequestButton = elements.create('paymentRequestButton', {
                    paymentRequest: paymentRequest,
                    style: {
                        paymentRequestButton: {
                            type: 'default',
                            theme: 'dark',
                        }
                    }
                });

                // Check if payment request is available
                paymentRequest.canMakePayment().then(result => {
                    if (result) {
                        console.log('Payment request available:', result);
                        // Show the payment request button
                        document.getElementById('payment-request-button-container').style.display = 'block';
                        document.getElementById('express-payment-buttons').classList.add('hidden');
                        document.getElementById('payment-methods-message').classList.add('hidden');
                        paymentRequestButton.mount('#payment-request-button-container');
                    } else {
                        console.log('Payment request not available');
                        // Hide the container if not available
                        document.getElementById('payment-request-button-container').style.display = 'none';
                        document.getElementById('express-payment-buttons').classList.remove('hidden');
                        document.getElementById('payment-methods-message').classList.remove('hidden');
                    }
                }).catch(error => {
                    console.error('Error checking payment request availability:', error);
                    // Hide the container and show fallback buttons
                    document.getElementById('payment-request-button-container').style.display = 'none';
                    document.getElementById('express-payment-buttons').classList.remove('hidden');
                    document.getElementById('payment-methods-message').classList.remove('hidden');
                });

                paymentRequest.on('paymentmethod', async (event) => {
                    // Confirm the payment
                    const { error, paymentIntent } = await stripe.confirmCardPayment(
                        paymentData.client_secret,
                        {
                            payment_method: event.paymentMethod.id,
                        },
                        { handleActions: false }
                    );

                    if (error) {
                        event.complete('fail');
                        showError(error.message);
                    } else {
                        if (paymentIntent.status === 'requires_action') {
                            stripe.confirmCardPayment(paymentData.client_secret).then(function(result) {
                                if (result.error) {
                                    event.complete('fail');
                                    showError(result.error.message);
                                } else {
                                    event.complete('success');
                                    document.getElementById('payment-form').classList.add('hidden');
                                    document.getElementById('success').classList.remove('hidden');
                                }
                            });
                        } else {
                            event.complete('success');
                            document.getElementById('payment-form').classList.add('hidden');
                            document.getElementById('success').classList.remove('hidden');
                        }
                    }
                });
            } catch (e) {
                console.error('Stripe initialization error:', e);
                showError('Payment system unavailable');
            }
        }

        async function processPayment() {
            if (!stripe || !cardElement || !paymentData) {
                showError('Payment system unavailable');
                return;
            }

            const payBtn = document.getElementById('pay-btn');
            payBtn.disabled = true;
            payBtn.textContent = 'Processing...';

            try {
                const { error, paymentIntent } = await stripe.confirmCardPayment(
                    paymentData.client_secret,
                    {
                        payment_method: {
                            card: cardElement
                        }
                    }
                );

                if (error) {
                    document.getElementById('card-errors').textContent = error.message;
                    payBtn.disabled = false;
                    payBtn.textContent = 'Pay';
                } else {
                    // Payment successful
                    document.getElementById('payment-form').classList.add('hidden');
                    document.getElementById('success').classList.remove('hidden');
                }
            } catch (error) {
                console.error('Payment error:', error);
                showError('Payment failed: ' + error.message);
            }
        }

        function showError(message) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('payment-form').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('error-message').textContent = message;
        }
    </script>
</body>
</html>
