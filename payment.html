<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Rabbit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .stripe-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            background: #fff;
        }
        .stripe-card:focus-within {
            border-color: #635bff;
            box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.1);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-lg shadow-sm">
            <!-- Header -->
            <div class="p-6 border-b border-gray-200">
                <div class="flex items-center gap-3 mb-4">
                    <img src="logo.jpg" alt="Rabbit Logo" class="h-10 w-10 rounded-lg object-cover">
                    <div>
                        <h1 class="text-lg font-semibold text-gray-900">Rabbit</h1>
                        <p class="text-sm text-gray-500">Payment</p>
                    </div>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loading" class="p-8 text-center">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-gray-300 mx-auto mb-4"></div>
                <p class="text-gray-500 text-sm">Loading...</p>
            </div>

            <!-- Payment Form -->
            <div id="payment-form" class="hidden p-6">
                <div class="mb-6">
                    <h2 id="payment-title" class="text-lg font-semibold text-gray-900 mb-1">Payment</h2>
                    <p id="payment-description" class="text-sm text-gray-500"></p>
                </div>

                <div class="bg-gray-50 rounded-lg p-4 mb-6">
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600 text-sm">Total</span>
                        <span id="payment-amount" class="text-2xl font-semibold text-gray-900">£0.00</span>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Card details</label>
                    <div id="card-element" class="stripe-card"></div>
                    <div id="card-errors" class="text-red-500 text-sm mt-2"></div>
                </div>

                <button onclick="processPayment()" id="pay-btn" class="w-full bg-gray-900 hover:bg-gray-800 text-white p-4 rounded-lg font-medium transition">
                    Pay
                </button>
            </div>

            <!-- Success State -->
            <div id="success" class="hidden p-8 text-center">
                <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <h2 class="text-lg font-semibold text-gray-900 mb-2">Payment successful</h2>
                <p class="text-sm text-gray-500">Thank you for your payment.</p>
            </div>

            <!-- Error State -->
            <div id="error" class="hidden p-8 text-center">
                <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </div>
                <h2 class="text-lg font-semibold text-gray-900 mb-2">Payment failed</h2>
                <p id="error-message" class="text-sm text-gray-500 mb-4">Something went wrong.</p>
                <button onclick="location.reload()" class="bg-gray-900 hover:bg-gray-800 text-white px-6 py-2 rounded-lg font-medium transition">
                    Try again
                </button>
            </div>
        </div>
    </div>

    <script>
        const STRIPE_PUBLISHABLE_KEY = 'pk_live_51U7YZRIgHrqGQ08gbdu7U7Q4sFTSliP3HjOvRbE8kWAuQ5rXfe4FUnqdB6y6E67KybV4eA8CdrA0tKBOTqPmvW1l00FUNaZ5GC';
        let stripe;
        let cardElement;
        let paymentData = null;

        // Get payment ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const paymentId = urlParams.get('id');

        if (!paymentId) {
            showError('Invalid payment link');
        } else {
            loadPaymentDetails(paymentId);
        }

        function loadPaymentDetails(id) {
            // Load from localStorage (in production, this would be from Supabase)
            const savedLinks = localStorage.getItem('rabbit_payment_links');
            if (savedLinks) {
                const links = JSON.parse(savedLinks);
                paymentData = links.find(l => l.id === id);
            }

            if (!paymentData) {
                showError('Payment not found or expired');
                return;
            }

            // Show payment form
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('payment-form').classList.remove('hidden');

            // Update UI
            document.getElementById('payment-title').textContent = paymentData.title;
            document.getElementById('payment-description').textContent = paymentData.description || '';
            const currencySymbol = paymentData.currency === 'eur' ? '€' : paymentData.currency === 'usd' ? '$' : '£';
            document.getElementById('payment-amount').textContent = currencySymbol + paymentData.amount.toFixed(2);

            // Initialize Stripe
            initializeStripe();
        }

        function initializeStripe() {
            try {
                stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
                const elements = stripe.elements({
                    appearance: {
                        theme: 'stripe',
                        variables: {
                            colorPrimary: '#635bff',
                            colorBackground: '#ffffff',
                            colorText: '#32325d',
                            colorDanger: '#df1b41',
                            fontFamily: 'Inter, sans-serif',
                            spacingUnit: '4px',
                            borderRadius: '8px',
                        }
                    }
                });

                cardElement = elements.create('card', {
                    style: {
                        base: {
                            fontSize: '16px',
                            color: '#32325d',
                            fontFamily: 'Inter, sans-serif',
                            '::placeholder': {
                                color: '#aab7c4'
                            }
                        }
                    }
                });

                cardElement.mount('#card-element');
                cardElement.on('change', function(event) {
                    const displayError = document.getElementById('card-errors');
                    if (event.error) {
                        displayError.textContent = event.error.message;
                    } else {
                        displayError.textContent = '';
                    }
                });
            } catch (e) {
                console.error('Stripe initialization error:', e);
                showError('Payment system unavailable');
            }
        }

        async function processPayment() {
            if (!stripe || !cardElement || !paymentData) {
                showError('Payment system unavailable');
                return;
            }

            const payBtn = document.getElementById('pay-btn');
            payBtn.disabled = true;
            payBtn.textContent = 'Processing...';

            try {
                const { error, paymentIntent } = await stripe.confirmCardPayment(
                    paymentData.clientSecret,
                    {
                        payment_method: {
                            card: cardElement
                        }
                    }
                );

                if (error) {
                    document.getElementById('card-errors').textContent = error.message;
                    payBtn.disabled = false;
                    payBtn.textContent = 'Pay';
                } else {
                    // Payment successful
                    document.getElementById('payment-form').classList.add('hidden');
                    document.getElementById('success').classList.remove('hidden');
                }
            } catch (error) {
                console.error('Payment error:', error);
                showError('Payment failed: ' + error.message);
            }
        }

        function showError(message) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('payment-form').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('error-message').textContent = message;
        }
    </script>
</body>
</html>
